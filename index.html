<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vortex - موقع ألعاب</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b16;
            color: white;
            min-height: 100vh;
            text-align: center;
        }

        header {
            padding: 35px 15px;
            background: linear-gradient(135deg, #15152b, #26104d);
        }

        h1 {
            font-size: 45px;
            color: #9d4edd;
            margin-bottom: 15px;
        }

        .welcome {
            font-size: 22px;
            color: #eee;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: #151525;
            border-radius: 18px;
            padding: 25px;
            margin: 20px 0;
            border: 1px solid #29294a;
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
        }

        .card h2 {
            margin-bottom: 20px;
        }

        a {
            display: block;
            text-decoration: none;
            color: white;
            padding: 16px;
            margin: 12px 0;
            border-radius: 12px;
            font-size: 18px;
            transition: 0.2s;
        }

        .youtube {
            background: #ff0000;
        }

        .whatsapp {
            background: #25d366;
        }

        a:hover {
            transform: scale(1.03);
            opacity: 0.9;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            color: #888;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
            }

            .welcome {
                font-size: 18px;
            }

            .container {
                margin-top: 25px;
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>VORTEX</h1>
        <p class="welcome">🎮 أهلاً بكم في موقع ألعاب Vortex 🎮</p>
    </header>

    <main class="container">

        <div class="card">
            <h2>روابطنا</h2>

            <a class="youtube"
               href="https://www.youtube.com/@elsayodav"
               target="_blank">
                ▶️ قناة اليوتيوب
            </a>

            <a class="whatsapp"
               href="https://chat.whatsapp.com/Heo5TD2OZ056TVClBwzrxW"
               target="_blank">
                💬 جروب الواتساب
            </a>
        </div>

    </main>

    <footer>
        © 2026 Vortex - جميع الحقوق محفوظة
    </footer>

</body>
</html>
