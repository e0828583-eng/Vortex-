<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vortex - موقع ألعاب</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080812;
            color: white;
            min-height: 100vh;
            text-align: center;
        }

        /* الهيدر */
        header {
            padding: 45px 15px;
            background:
                radial-gradient(circle at top, #452080, transparent 45%),
                linear-gradient(135deg, #111122, #09090f);
            border-bottom: 1px solid #292944;
        }

        .logo {
            font-size: 52px;
            font-weight: bold;
            letter-spacing: 5px;
            color: #b56cff;
            text-shadow: 0 0 25px rgba(181, 108, 255, 0.5);
        }

        .welcome {
            margin-top: 15px;
            font-size: 21px;
            color: #eeeeee;
        }

        /* المحتوى */
        .container {
            width: 100%;
            max-width: 850px;
            margin: auto;
            padding: 25px 15px;
        }

        .card {
            background: linear-gradient(145deg, #151525, #10101c);
            border: 1px solid #292944;
            border-radius: 22px;
            padding: 25px;
            margin: 25px 0;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
        }

        .card-title {
            font-size: 27px;
            margin-bottom: 22px;
        }

        /* الأزرار العامة */
        .button {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 13px 0;
            border-radius: 14px;
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            transition: 0.25s;
            border: 1px solid transparent;
        }

        .button:hover {
            transform: translateY(-3px);
            opacity: 0.92;
        }

        /* يوتيوب */
        .youtube {
            background: #e60000;
        }

        /* واتساب */
        .whatsapp {
            background: #18b957;
        }

        /* قسم الألعاب */
        .games-card {
            background:
                linear-gradient(145deg, #18152b, #10101b);
        }

        .games-title {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .games-description {
            color: #aaaabe;
            margin-bottom: 25px;
            font-size: 15px;
        }

        .game-button {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;

            width: 100%;
            padding: 18px 20px;
            margin: 14px 0;

            background: #202033;
            color: white;
            text-decoration: none;

            border: 1px solid #353552;
            border-radius: 15px;

            font-size: 18px;
            font-weight: bold;

            transition: 0.25s;
        }

        .game-button:hover {
            background: #292944;
            border-color: #a65cff;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(166, 92, 255, 0.15);
        }

        .game-name {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .game-icon {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #302047;
            border-radius: 11px;
            font-size: 22px;
        }

        .download {
            color: #b56cff;
            font-size: 14px;
        }

        /* الفوتر */
        footer {
            margin-top: 45px;
            padding: 25px 15px;
            color: #77778a;
            border-top: 1px solid #202033;
            font-size: 14px;
        }

        /* الموبايل */
        @media (max-width: 600px) {

            header {
                padding: 35px 12px;
            }

            .logo {
                font-size: 40px;
            }

            .welcome {
                font-size: 18px;
            }

            .container {
                padding: 15px 12px;
            }

            .card {
                padding: 20px 15px;
            }

            .games-title {
                font-size: 25px;
            }

            .game-button {
                padding: 15px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
